------------------------------ UKCAT pipeline explanation --------------------------
--[[
(Hospital side)

Python script moves data from PACS to receiver

Python script has --trialData flag to force the MessageID to 0xcafe

Reciever runs 

ukcat_namer ; with this code:
  if Command.MoveOriginatorMessageID=='51966' or Command.MessageID=='51966' then 
    Data["9999,cafe"]='trial'
    local patid = string.gsub(Data.PatientID, 'RBV', '')
    Data["9999,1234"]='trial_'..md5(patid) 
    return
  end
  --otherwise read patientID and dateshift from Postgres database

ukcat_anonymiser ; uses this configuration file, passing 9999cafe

forward to cmpe-thera-fs2


(UKCAT side)

Server CAT on cmpe-thera-fs2 acts as DICOM router with the following config:
  ImportConverter0 = lua:if Data["9999,cafe"] then Data["9999,cafe"]=nil; script("forward to 130.88.147.211:11113; destroy") end
  ImportConverter1 = forward to 130.88.147.211:11112; destroy
  QueryConverter0 = destroy
  RetrieveConverter0 = destroy

Server CAT on 130.88.147.211:11112
(no additional processing)

Server TRIAL on 130.88.147.211:11113
matches PatientID against key tables with the following config:
  [lua]
  association = dofile('lua/readkeys.lua') k_01=readkeys('keys/earrad.csv')
  ImportConverter0 = newid = k_01[Data.PatientID]; if newid then Data.PatientID=newid end

Key table e.g.
  Hosp ID,Earad ID
  2022xxxxxx,ERD29

This means that known trial patients get their trial ID; others keep e.g. trial_849849859348593583 as ID
----------------------------------------------------------------------------------------
]]

